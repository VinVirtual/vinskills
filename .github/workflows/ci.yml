name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install poppler (PDF tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generated files are up to date
        run: node scripts/build-marketplace.mjs --check
      - name: Lint manifests and skills
        run: node scripts/validate.mjs
      - name: Tests (the claude CLI test is skipped on the runner)
        run: npm test
      - name: Pinned sources exist and are public
        run: npm run test:online
        env:
          GH_TOKEN: ${{ github.token }}

  skill-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: VinVirtual/skill-ci@ba5b72f63c1b0a6061b7d088c784d2e409fd89c8 # v1.0.0
        with:
          path: .
          lock-config: "true"
